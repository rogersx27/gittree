name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones anteriores de la misma rama cuando llega un push nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # La matriz cubre el Requirement 7: la herramienta debe correr igual en
    # Windows y en Linux, que son los dos entornos objetivo del proyecto
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} · node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v5

      # La version de pnpm se toma del campo packageManager del package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Ejecutar tests
        run: pnpm test
